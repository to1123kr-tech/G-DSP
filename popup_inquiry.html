<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>G-DSP — 문의 게시판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;--bg2:#eef1f6;--card:#fff;--line:#dde3ed;--line2:#c8d0e0;
  --txt:#1a2540;--txt2:#3d5070;--txt3:#7a90b0;
  --blue:#2563eb;--blue2:#3b82f6;--blue3:#1d4ed8;
  --green:#059669;--red:#ef4444;--purple:#7c3aed;--amber:#d97706;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select,textarea{font:inherit}
button{border:none;background:none;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
body.dark{--bg:#0f1623;--bg2:#141e2e;--card:#1a2640;--line:#243552;--line2:#2e4168;--txt:#e8f0ff;--txt2:#aabbd4;--txt3:#6a85a8}
.wrap{display:flex;flex-direction:column;height:100vh}
.hdr{height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06);flex-shrink:0}
.hdr-logo{font-size:15px;font-weight:900;color:var(--blue);letter-spacing:1px}
.hdr-sep{width:1px;height:18px;background:var(--line)}
.hdr-title{font-size:14px;font-weight:700;color:var(--txt)}
.hdr-sub{font-size:11px;color:var(--txt3);margin-left:4px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--txt2);font-size:11px;font-weight:700;transition:.15s}
.hbtn:hover{border-color:var(--blue2);color:var(--blue2)}
.hbtn.close{border-color:rgba(239,68,68,.3);color:var(--red);background:rgba(239,68,68,.05)}
.hbtn.close:hover{background:rgba(239,68,68,.1)}
.hbtn.admin-on{border-color:rgba(217,119,6,.4);color:var(--amber);background:rgba(217,119,6,.08)}
.admin-chip{display:none;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.3);color:var(--amber);font-size:10px;font-weight:700}
body.is-admin .admin-chip{display:inline-flex}
.netbar{display:none;padding:8px 20px;background:rgba(239,68,68,.08);border-bottom:1px solid rgba(239,68,68,.2);color:var(--red);font-size:11px;font-weight:600;flex-shrink:0}
.netbar.on{display:block}
.body{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.col-left{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.write-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card-title{font-size:12px;font-weight:700;color:var(--txt3);letter-spacing:.6px;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.card-title svg{width:13px;height:13px;color:var(--purple)}
.mf{width:100%;height:36px;padding:0 12px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-size:12px;outline:none;transition:.15s;margin-bottom:8px}
.mf:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.mf::placeholder{color:var(--txt3)}
textarea.mf{height:110px;padding:10px 12px;resize:vertical}
.type-grid,.vis-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.type-btn,.vis-btn{height:32px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt3);font-size:11px;font-weight:700;transition:.15s}
.type-btn.on{background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.3);color:var(--purple)}
.vis-btn.on{background:rgba(37,99,235,.1);border-color:rgba(37,99,235,.35);color:var(--blue2)}
.vis-hint{font-size:10px;color:var(--txt3);line-height:1.6;margin:-4px 0 10px}
.cc{font-size:10px;color:var(--txt3);text-align:right;margin:-4px 0 6px}
.submit-btn{width:100%;height:40px;border-radius:9px;background:linear-gradient(135deg,var(--blue3),var(--blue2));border:none;color:#fff;font-size:13px;font-weight:700;transition:.15s;margin-top:4px}
.submit-btn:hover{filter:brightness(1.08)}
.tool-card{display:none;background:var(--card);border:1px solid rgba(217,119,6,.28);border-radius:14px;padding:16px 18px}
body.is-admin .tool-card{display:block}
.tool-card .card-title svg{color:var(--amber)}
.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tbtn{height:32px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt2);font-size:11px;font-weight:700;transition:.15s}
.tbtn:hover{border-color:var(--blue2);color:var(--blue2)}
.tbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.list-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.list-hdr-title{font-size:14px;font-weight:700}
.list-count{font-size:11px;color:var(--txt3);background:var(--bg2);padding:2px 8px;border-radius:10px;border:1px solid var(--line)}
.search{margin-left:auto;height:30px;width:180px;padding:0 11px;background:var(--card);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-size:12px;outline:none}
.search:focus{border-color:var(--blue)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt3);font-size:11px;font-weight:700;transition:.15s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.admin-only{display:none}
body.is-admin .chip.admin-only{display:inline-block}
.list-empty{text-align:center;color:var(--txt3);font-size:13px;padding:48px 0}
.list-empty svg{width:40px;height:40px;opacity:.25;margin:0 auto 10px;display:block}
.inq-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:.15s}
.inq-card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.inq-card.secret{border-left:3px solid var(--amber)}
.inq-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.inq-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}
.b-idea{background:rgba(37,99,235,.1);color:var(--blue2);border:1px solid rgba(37,99,235,.2)}
.b-bug{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.b-help{background:rgba(5,150,105,.1);color:var(--green);border:1px solid rgba(5,150,105,.2)}
.b-etc{background:rgba(124,58,237,.1);color:var(--purple);border:1px solid rgba(124,58,237,.2)}
.b-lock{background:rgba(217,119,6,.1);color:var(--amber);border:1px solid rgba(217,119,6,.25)}
.b-done{background:rgba(5,150,105,.12);color:var(--green);border:1px solid rgba(5,150,105,.25)}
.inq-name{font-size:12px;font-weight:700}
.inq-mine{font-size:10px;color:var(--blue2);font-weight:700}
.inq-ip{font-size:10px;color:var(--txt3);font-family:monospace}
.inq-date{font-size:10px;color:var(--txt3);margin-left:auto}
.inq-content{font-size:12px;color:var(--txt2);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.inq-masked{font-size:12px;color:var(--txt3);line-height:1.7}
.inq-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.abtn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);color:var(--txt3);font-size:10px;font-weight:700;transition:.15s}
.abtn:hover{color:var(--txt2);border-color:var(--line2)}
.abtn.del{color:var(--red);border-color:rgba(239,68,68,.25)}
.abtn.del:hover{background:rgba(239,68,68,.08)}
.abtn.rep{color:var(--green);border-color:rgba(5,150,105,.25)}
.abtn.rep:hover{background:rgba(5,150,105,.08)}
.reply{margin-top:10px;padding:10px 12px;border-radius:0 9px 9px 0;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--green)}
.reply-lbl{font-size:10px;font-weight:700;color:var(--green);margin-bottom:4px}
.reply-txt{font-size:12px;color:var(--txt2);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.reply-date{font-size:10px;color:var(--txt3);margin-top:5px}
.reply-edit{margin-top:10px}
.reply-edit textarea{width:100%;height:74px;padding:9px 11px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-size:12px;outline:none;resize:vertical}
.reply-edit textarea:focus{border-color:var(--green)}
.modal-back{position:fixed;inset:0;background:rgba(10,16,28,.55);display:none;align-items:center;justify-content:center;z-index:9000}
.modal-back.on{display:flex}
.modal{width:320px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:6px}
.modal p{font-size:11px;color:var(--txt3);line-height:1.7;margin-bottom:14px}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.modal-row .tbtn{height:36px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.theme-btn{height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt2);font-size:11px;font-weight:700}
@media(max-width:820px){.body{grid-template-columns:1fr}.col-left{position:static}.search{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <span class="hdr-logo">G-DSP</span>
    <div class="hdr-sep"></div>
    <span class="hdr-title">💬 문의 게시판</span>
    <span class="hdr-sub">건의 · 오류 신고 · 사용법 문의</span>
    <div class="hdr-right">
      <span class="admin-chip">🔑 관리자 모드</span>
      <button class="hbtn" id="adminBtn" onclick="adminToggle()">🔒 관리자 로그인</button>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 다크</button>
      <button class="hbtn close" onclick="closeWin()">✕ 닫기</button>
    </div>
  </div>
  <div class="netbar" id="netBar">서버에 연결할 수 없습니다. 잠시 후 새로고침해 주세요.</div>

  <div class="body">
    <div class="col-left">
      <div class="write-card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          문의 작성
        </div>
        <input class="mf" id="inqName" type="text" maxlength="30" placeholder="이름 (선택 · 미입력 시 익명)">
        <div class="type-grid">
          <button class="type-btn on" id="type-0" onclick="setType(0,'기능 건의')">💡 기능 건의</button>
          <button class="type-btn" id="type-1" onclick="setType(1,'오류 신고')">🐛 오류 신고</button>
          <button class="type-btn" id="type-2" onclick="setType(2,'사용법 문의')">❓ 사용법 문의</button>
          <button class="type-btn" id="type-3" onclick="setType(3,'기타')">📌 기타</button>
        </div>
        <div class="vis-grid">
          <button class="vis-btn on" id="vis-0" onclick="setVis(false)">🌐 공개</button>
          <button class="vis-btn" id="vis-1" onclick="setVis(true)">🔒 비공개</button>
        </div>
        <div class="vis-hint" id="visHint">누구나 내용을 볼 수 있습니다.</div>
        <textarea class="mf" id="inqContent" maxlength="3000" placeholder="문의 내용을 입력하세요..." oninput="cc()"></textarea>
        <div class="cc" id="ccLbl">0 / 3000</div>
        <button class="submit-btn" id="subBtn" onclick="submitInquiry()">✉ 문의 등록</button>
      </div>

      <div class="tool-card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
          관리자 도구
        </div>
        <div class="tool-row">
          <button class="tbtn" onclick="loadList()">↻ 새로고침</button>
          <button class="tbtn" onclick="exportJSON()">⬇ 백업 저장</button>
        </div>
      </div>
    </div>

    <div>
      <div class="list-hdr">
        <span class="list-hdr-title">등록된 문의</span>
        <span class="list-count" id="inqCount">불러오는 중…</span>
        <input class="search" id="searchBox" type="text" placeholder="🔍 내용 · 이름 검색" oninput="render()">
      </div>
      <div class="filters" id="filters">
        <button class="chip on" data-f="all" onclick="setFilter(this)">전체</button>
        <button class="chip" data-f="기능 건의" onclick="setFilter(this)">💡 기능 건의</button>
        <button class="chip" data-f="오류 신고" onclick="setFilter(this)">🐛 오류 신고</button>
        <button class="chip" data-f="사용법 문의" onclick="setFilter(this)">❓ 사용법 문의</button>
        <button class="chip" data-f="기타" onclick="setFilter(this)">📌 기타</button>
        <button class="chip admin-only" data-f="secret" onclick="setFilter(this)">🔒 비공개만</button>
        <button class="chip admin-only" data-f="noreply" onclick="setFilter(this)">✍ 미답변</button>
      </div>
      <div id="inqList"></div>
      <div class="list-empty" id="inqEmpty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span id="emptyMsg">아직 등록된 문의가 없습니다</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3>관리자 로그인</h3>
    <p>관리자 비밀번호를 입력하세요. 비공개 문의 내용은 로그인한 뒤에만 서버가 전달합니다.</p>
    <input class="mf" id="pwInput" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="modal-row">
      <button class="tbtn" onclick="mdClose()">취소</button>
      <button class="tbtn primary" id="loginBtn" onclick="doLogin()">로그인</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
/* ══════════════════════════════════════════════════
   G-DSP 문의 게시판 — 서버 저장 방식
   데이터는 gdsp.kr 서버(gdsp_inq.json)에 저장됩니다.
   비공개 문의 내용은 관리자 로그인 시에만 서버가 내려보냅니다.
   ══════════════════════════════════════════════════ */
var API = (location.protocol === 'file:') ? 'https://gdsp.kr' : '';
var K_UID='gdsp_uid', K_THEME='gdsp_theme', K_TOKEN='gdsp_inq_token';

var items=[], selType='기능 건의', selSecret=false, curFilter='all',
    isAdmin=false, token='', uid='', busy=false, _tt;

/* ── 유틸 ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(ts){ var d=new Date(ts); if(isNaN(d))return'';
  return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function toast(m,t){ var e=document.getElementById('toast'); e.textContent=m;
  e.style.background = t==='err'?'#991b1b' : t==='ok'?'#0f766e' : '#1e293b';
  e.style.opacity='1'; e.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(_tt); _tt=setTimeout(function(){ e.style.opacity='0';
    e.style.transform='translateX(-50%) translateY(20px)'; },2400); }
function net(bad){ document.getElementById('netBar').classList.toggle('on',!!bad); }
function closeWin(){ window.close();
  setTimeout(function(){ toast('이 창은 직접 닫아주세요','err'); },200); }
function cc(){ document.getElementById('ccLbl').textContent =
  document.getElementById('inqContent').value.length + ' / 3000'; }

/* ── 서버 통신 ── */
function api(path, opt){
  opt = opt || {};
  opt.headers = token ? {'Content-Type':'application/json','X-Admin-Token':token}
                      : {'Content-Type':'application/json'};
  if(opt.body) opt.body = JSON.stringify(opt.body);
  return fetch(API+path, opt).then(function(r){
    return r.json().catch(function(){ return {ok:false,msg:'서버 응답 오류'}; })
      .then(function(j){ net(false); return j; });
  }).catch(function(){ net(true); return {ok:false,msg:'서버에 연결할 수 없습니다',_net:true}; });
}

function loadList(){
  return api('/api/inq/list?uid='+encodeURIComponent(uid)).then(function(j){
    if(!j.ok){ document.getElementById('inqCount').textContent='연결 실패';
      if(!j._net) toast(j.msg||'목록을 불러오지 못했습니다','err'); return; }
    items = j.items || [];
    if(isAdmin && !j.admin){ setAdmin(false, true); return; }   // 토큰 만료
    render();
  });
}

/* ── 작성 폼 ── */
function setType(i,t){ selType=t;
  for(var k=0;k<4;k++){ var b=document.getElementById('type-'+k); if(b)b.classList.toggle('on',k===i); } }
function setVis(s){ selSecret=s;
  document.getElementById('vis-0').classList.toggle('on',!s);
  document.getElementById('vis-1').classList.toggle('on',s);
  document.getElementById('visHint').textContent = s
    ? '관리자와 작성자 본인만 볼 수 있습니다. 내용이 다른 사람에게 전달되지 않습니다.'
    : '누구나 내용을 볼 수 있습니다.'; }

function submitInquiry(){
  if(busy) return;
  var content=document.getElementById('inqContent').value.trim();
  if(!content){ toast('내용을 입력하세요','err'); return; }
  busy=true; document.getElementById('subBtn').disabled=true;
  api('/api/inq/add',{method:'POST',body:{
    uid:uid, name:document.getElementById('inqName').value.trim(),
    type:selType, content:content, secret:selSecret }})
  .then(function(j){
    busy=false; document.getElementById('subBtn').disabled=false;
    if(!j.ok){ toast(j.msg||'등록하지 못했습니다','err'); return; }
    document.getElementById('inqContent').value=''; cc();
    loadList(); toast('문의를 등록했습니다','ok');
  });
}

/* ── 목록 ── */
var badgeMap={'기능 건의':'b-idea','오류 신고':'b-bug','사용법 문의':'b-help','기타':'b-etc'};
function setFilter(btn){ curFilter=btn.getAttribute('data-f');
  var c=document.querySelectorAll('#filters .chip');
  for(var i=0;i<c.length;i++) c[i].classList.toggle('on',c[i]===btn);
  render(); }

function render(){
  var list=document.getElementById('inqList'), empty=document.getElementById('inqEmpty'),
      kw=(document.getElementById('searchBox').value||'').trim().toLowerCase();

  var rows=items.filter(function(q){
    if(curFilter==='secret'){ if(!q.secret) return false; }
    else if(curFilter==='noreply'){ if(q.answered) return false; }
    else if(curFilter!=='all'){ if(q.type!==curFilter) return false; }
    if(kw && (q.name+' '+q.type+' '+(q.content||'')).toLowerCase().indexOf(kw)<0) return false;
    return true;
  });

  document.getElementById('inqCount').textContent =
    rows.length+'건' + (rows.length!==items.length ? ' / 전체 '+items.length+'건' : '');

  if(!rows.length){
    list.innerHTML=''; empty.style.display='block';
    document.getElementById('emptyMsg').textContent =
      items.length ? '조건에 맞는 문의가 없습니다' : '아직 등록된 문의가 없습니다';
    return;
  }
  empty.style.display='none';

  list.innerHTML = rows.map(function(q){
    var bc=badgeMap[q.type]||'b-etc', canDel=isAdmin||q.mine;
    var h='<div class="inq-card'+(q.secret?' secret':'')+'">'
      + '<div class="inq-top">'
      +   '<span class="inq-badge '+bc+'">'+esc(q.type)+'</span>'
      +   (q.secret?'<span class="inq-badge b-lock">🔒 비공개</span>':'')
      +   (q.answered?'<span class="inq-badge b-done">✓ 답변완료</span>':'')
      +   '<span class="inq-name">'+esc(q.name)+'</span>'
      +   (q.mine?'<span class="inq-mine">내 글</span>':'')
      +   (q.ip?'<span class="inq-ip">'+esc(q.ip)+'</span>':'')
      +   '<span class="inq-date">'+esc(fmt(q.ts))+'</span>'
      + '</div>';

    h += q.locked
      ? '<div class="inq-masked">🔒 비공개 문의입니다. 관리자와 작성자만 볼 수 있습니다.</div>'
      : '<div class="inq-content">'+esc(q.content)+'</div>';

    if(q.reply){
      h += '<div class="reply"><div class="reply-lbl">↳ 관리자 답변</div>'
        +  '<div class="reply-txt">'+esc(q.reply.content)+'</div>'
        +  '<div class="reply-date">'+esc(fmt(q.reply.ts))+'</div></div>';
    }

    if(canDel||isAdmin){
      h += '<div class="inq-acts">';
      if(isAdmin) h += '<button class="abtn rep" onclick="openReply(\''+q.id+'\')">'
                    + (q.reply?'✎ 답변 수정':'✍ 답변 달기')+'</button>'
                    + '<button class="abtn" onclick="flipSecret(\''+q.id+'\','+(!q.secret)+')">'
                    + (q.secret?'🌐 공개로 전환':'🔒 비공개로 전환')+'</button>';
      if(canDel) h += '<button class="abtn del" onclick="delInq(\''+q.id+'\')">🗑 삭제</button>';
      h += '</div>';
    }
    if(isAdmin){
      h += '<div class="reply-edit" id="re-'+q.id+'" style="display:none">'
        +  '<textarea id="rt-'+q.id+'" maxlength="3000" placeholder="답변 내용을 입력하세요...">'
        +  esc(q.reply?q.reply.content:'')+'</textarea><div class="inq-acts">'
        +  '<button class="abtn rep" onclick="saveReply(\''+q.id+'\')">저장</button>'
        +  '<button class="abtn" onclick="closeReply(\''+q.id+'\')">취소</button>'
        +  (q.reply?'<button class="abtn del" onclick="saveReply(\''+q.id+'\',1)">답변 삭제</button>':'')
        +  '</div></div>';
    }
    return h+'</div>';
  }).join('');
}

/* ── 동작 ── */
function delInq(id){
  if(!confirm('이 문의를 삭제할까요? 되돌릴 수 없습니다.')) return;
  api('/api/inq/del',{method:'POST',body:{id:id,uid:uid}}).then(function(j){
    if(!j.ok){ toast(j.msg||'삭제하지 못했습니다','err'); return; }
    loadList(); toast('문의를 삭제했습니다','ok'); });
}
function flipSecret(id,to){
  api('/api/inq/secret',{method:'POST',body:{id:id,secret:to}}).then(function(j){
    if(!j.ok){ toast(j.msg||'전환하지 못했습니다','err'); return; }
    loadList(); toast(to?'비공개로 바꿨습니다':'공개로 바꿨습니다','ok'); });
}
function openReply(id){ var e=document.getElementById('re-'+id);
  if(e){ e.style.display='block'; document.getElementById('rt-'+id).focus(); } }
function closeReply(id){ var e=document.getElementById('re-'+id); if(e) e.style.display='none'; }
function saveReply(id,clear){
  var v = clear ? '' : document.getElementById('rt-'+id).value.trim();
  if(clear && !confirm('답변을 삭제할까요?')) return;
  if(!clear && !v){ toast('답변 내용을 입력하세요','err'); return; }
  api('/api/inq/reply',{method:'POST',body:{id:id,content:v}}).then(function(j){
    if(!j.ok){ toast(j.msg||'저장하지 못했습니다','err'); return; }
    loadList(); toast(clear?'답변을 삭제했습니다':'답변을 저장했습니다','ok'); });
}
function exportJSON(){
  api('/api/inq/export').then(function(j){
    if(!j.ok){ toast(j.msg||'백업하지 못했습니다','err'); return; }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(j.items,null,2)],{type:'application/json'}));
    a.download='gdsp-inquiries-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('문의 '+j.items.length+'건을 저장했습니다','ok'); });
}

/* ── 관리자 ── */
function mdClose(){ document.getElementById('modalBack').classList.remove('on'); }
function adminToggle(){
  if(isAdmin){ api('/api/inq/logout',{method:'POST',body:{}}); setAdmin(false);
    toast('로그아웃했습니다'); loadList(); return; }
  document.getElementById('pwInput').value='';
  document.getElementById('modalBack').classList.add('on');
  setTimeout(function(){ document.getElementById('pwInput').focus(); },50);
}
function doLogin(){
  var pw=document.getElementById('pwInput').value;
  if(!pw){ toast('비밀번호를 입력하세요','err'); return; }
  var btn=document.getElementById('loginBtn'); btn.disabled=true;
  fetch(API+'/api/inq/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pw:pw})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      btn.disabled=false;
      if(!j.ok){ toast(j.msg||'로그인하지 못했습니다','err'); return; }
      token=j.token;
      try{ sessionStorage.setItem(K_TOKEN,token); }catch(e){}
      mdClose(); setAdmin(true); loadList(); toast('관리자로 로그인했습니다','ok');
    })
    .catch(function(){ btn.disabled=false; net(true); toast('서버에 연결할 수 없습니다','err'); });
}
function setAdmin(on,expired){
  isAdmin=on;
  document.body.classList.toggle('is-admin',on);
  var b=document.getElementById('adminBtn');
  b.textContent = on?'🚪 로그아웃':'🔒 관리자 로그인';
  b.classList.toggle('admin-on',on);
  if(!on){
    token=''; try{ sessionStorage.removeItem(K_TOKEN); }catch(e){}
    if(expired){ toast('로그인이 만료되었습니다. 다시 로그인해 주세요','err'); loadList(); }
    if(curFilter==='secret'||curFilter==='noreply'){
      var f=document.querySelector('#filters .chip'); if(f){ setFilter(f); return; } }
  }
  render();
}

/* ── 테마 ── */
function toggleTheme(){
  var d=document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = d?'☀️ 라이트':'🌙 다크';
  try{ localStorage.setItem(K_THEME, d?'dark':'light'); }catch(e){}
}

/* ── 시작 ── */
(function(){
  try{
    if(localStorage.getItem(K_THEME)==='dark'){ document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent='☀️ 라이트'; }
    uid=localStorage.getItem(K_UID);
    if(!uid){ uid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
      localStorage.setItem(K_UID,uid); }
    token=sessionStorage.getItem(K_TOKEN)||'';
  }catch(e){ uid='guest-'+Math.random().toString(36).slice(2,10); }

  if(token){ isAdmin=true; document.body.classList.add('is-admin');
    var b=document.getElementById('adminBtn');
    b.textContent='🚪 로그아웃'; b.classList.add('admin-on'); }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') mdClose(); });
  document.getElementById('modalBack').addEventListener('click',function(e){ if(e.target===this) mdClose(); });
  cc(); loadList();
  setInterval(loadList, 60000);   // 1분마다 자동 새로고침
})();
</script>
